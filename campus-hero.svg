<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Plane & Campus Landscaping -->
  <ellipse cx="300" cy="420" rx="270" ry="45" fill="#e2e8f0"/>
  <ellipse cx="300" cy="415" rx="250" ry="38" fill="#f1f5f9"/>

  <!-- Subtle AI Circuit Graphic in Background -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M 60,180 C 120,120 180,240 240,160"/>
    <path d="M 360,140 C 420,200 480,110 540,170"/>
    <circle cx="60" cy="180" r="4" fill="#3b82f6"/>
    <circle cx="240" cy="160" r="4" fill="#8b5cf6"/>
    <circle cx="360" cy="140" r="4" fill="#6366f1"/>
    <circle cx="540" cy="170" r="4" fill="#10b981"/>
  </g>

  <!-- Left Secondary Campus Wing -->
  <rect x="110" y="220" width="110" height="170" rx="8" fill="#334155" filter="url(#shadow)"/>
  <rect x="125" y="240" width="80" height="135" rx="4" fill="#1e293b"/>
  <!-- Windows Grid -->
  <g fill="#93c5fd" opacity="0.85">
    <rect x="135" y="255" width="15" height="18" rx="2"/>
    <rect x="160" y="255" width="15" height="18" rx="2"/>
    <rect x="185" y="255" width="15" height="18" rx="2"/>
    <rect x="135" y="285" width="15" height="18" rx="2"/>
    <rect x="160" y="285" width="15" height="18" rx="2"/>
    <rect x="185" y="285" width="15" height="18" rx="2"/>
    <rect x="135" y="315" width="15" height="18" rx="2"/>
    <rect x="160" y="315" width="15" height="18" rx="2"/>
    <rect x="185" y="315" width="15" height="18" rx="2"/>
    <rect x="135" y="345" width="15" height="18" rx="2"/>
    <rect x="160" y="345" width="15" height="18" rx="2"/>
    <rect x="185" y="345" width="15" height="18" rx="2"/>
  </g>

  <!-- Right Secondary Campus Wing (Auditorium & Labs) -->
  <rect x="380" y="210" width="120" height="180" rx="8" fill="#1e3a8a" filter="url(#shadow)"/>
  <rect x="395" y="230" width="90" height="145" rx="4" fill="url(#glassGrad)"/>
  <!-- Modern Vertical Louvers -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.6">
    <line x1="410" y1="230" x2="410" y2="375"/>
    <line x1="425" y1="230" x2="425" y2="375"/>
    <line x1="440" y1="230" x2="440" y2="375"/>
    <line x1="455" y1="230" x2="455" y2="375"/>
    <line x1="470" y1="230" x2="470" y2="375"/>
  </g>

  <!-- Center Main University Academic Tower -->
  <rect x="210" y="140" width="180" height="255" rx="12" fill="url(#buildingGrad)" filter="url(#shadow)"/>
  <!-- Classical Pillars and Modern Glass Entrance -->
  <rect x="230" y="160" width="140" height="70" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="300" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle" letter-spacing="1.5">APEX UNIVERSITY</text>
  <circle cx="300" cy="205" r="10" fill="#f59e0b"/>
  <polygon points="300,198 302,203 307,204 303.5,207 304.5,212 300,209 295.5,212 296.5,207 293,204 298,203" fill="#ffffff"/>

  <!-- Grand Pillars -->
  <g fill="#f8fafc">
    <rect x="235" y="245" width="14" height="120" rx="3"/>
    <rect x="260" y="245" width="14" height="120" rx="3"/>
    <rect x="285" y="245" width="14" height="120" rx="3"/>
    <rect x="310" y="245" width="14" height="120" rx="3"/>
    <rect x="335" y="245" width="14" height="120" rx="3"/>
    <rect x="360" y="245" width="14" height="120" rx="3"/>
  </g>
  <!-- Grand Arch Portal -->
  <path d="M 270,395 V 325 C 270,305 330,305 330,325 V 395 Z" fill="#0f172a"/>
  <!-- Grand Steps -->
  <polygon points="180,410 420,410 440,430 160,430" fill="#cbd5e1"/>
  <line x1="170" y1="416" x2="430" y2="416" stroke="#94a3b8" stroke-width="2"/>
  <line x1="165" y1="423" x2="435" y2="423" stroke="#94a3b8" stroke-width="2"/>

  <!-- Trees / Greenery -->
  <g fill="#10b981">
    <ellipse cx="80" cy="380" rx="24" ry="34"/>
    <ellipse cx="65" cy="385" rx="18" ry="24" fill="#059669"/>
    <rect x="76" y="395" width="8" height="25" fill="#78350f" rx="2"/>

    <ellipse cx="525" cy="385" rx="26" ry="36"/>
    <ellipse cx="540" cy="390" rx="20" ry="26" fill="#059669"/>
    <rect x="521" y="400" width="8" height="22" fill="#78350f" rx="2"/>
  </g>

  <!-- Floating Floating Chatbot Dialog Bubble (Left) -->
  <g filter="url(#shadow)" transform="translate(45, 60)">
    <rect x="0" y="0" width="170" height="70" rx="16" fill="#ffffff"/>
    <polygon points="130,70 145,84 140,70" fill="#ffffff"/>
    <circle cx="32" cy="35" r="18" fill="url(#purpleGrad)"/>
    <!-- Small Robot Eye inside badge -->
    <circle cx="28" cy="33" r="3" fill="#ffffff"/>
    <circle cx="36" cy="33" r="3" fill="#ffffff"/>
    <path d="M28 40 Q32 44 36 40" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="60" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Smart AI Assistant</text>
    <text x="60" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b">Admissions Open 2026-27</text>
    <text x="60" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#2563eb">Ask me anything!</text>
  </g>

  <!-- Floating Floating Student Query Bubble (Right) -->
  <g filter="url(#shadow)" transform="translate(390, 45)">
    <rect x="0" y="0" width="180" height="74" rx="16" fill="#1e3a8a"/>
    <polygon points="40,74 35,88 52,74" fill="#1e3a8a"/>
    <circle cx="30" cy="37" r="16" fill="#3b82f6"/>
    <text x="30" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
    <text x="56" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Student Query:</text>
    <text x="56" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#ffffff">"What is the fee for</text>
    <text x="56" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">B.Tech Computer Science?"</text>
  </g>

  <!-- Glowing Graduation Cap Floating Above Tower -->
  <g filter="url(#shadow)" transform="translate(265, 80)">
    <path d="M35 12 L65 24 L35 36 L5 24 Z" fill="#4f46e5"/>
    <path d="M20 28 V36 C20 40 35 44 35 44 C35 44 50 40 50 36 V28" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="26" x2="60" y2="44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="46" r="3" fill="#f59e0b"/>
  </g>
</svg>
